name: Halcon Airguns
on:
  push:
    paths: ["rifas/**", ".github/workflows/halcon.yml"]
  pull_request:
    paths: ["rifas/**", ".github/workflows/halcon.yml"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: halcon_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U test -d halcon_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://test:ci-test-only@localhost:5432/halcon_test
      JWT_SECRET: ci-only-secret-not-for-production-32-characters
      RUN_DB_TESTS: "true"
    defaults:
      run:
        working-directory: rifas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: rifas/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
